# Postgres de desenvolvimento. O compose de produção (app + worker + cloudflared)
# vem na etapa 5 do roadmap.
services:
  postgres:
    image: postgres:16-alpine
    container_name: habito_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_habito
      POSTGRES_USER: habito
      POSTGRES_PASSWORD: habito_dev
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habito -d controle_habito"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev:
