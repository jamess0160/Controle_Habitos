# Compose de produção: quatro serviços no homelab, atrás do nginx do host.
#
#                                   ┌────────────┐
#                                   │ Cloudflare │ ◀── celular, pelo domínio
#                                   └─────▲──────┘
#   ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ┼ ─ ─ túnel saindo ─ ─ ─ ─ ─ ─ ─ ─
#   ┌─────────────────────────┐           │
#   │ cloudflared do homelab  │ ──────────┘   ambos FORA desta pilha: o túnel
#   └──────┬──────────────────┘               manda tudo para o nginx, e o
#          │                                  nginx distribui por domínio.
#   ┌──────▼──────────────────┐
#   │ nginx do host           │  habitos.conf → proxy_pass 127.0.0.1:3000
#   └──────┬──────────────────┘
#          │ 127.0.0.1:3000 (loopback do host, não a rede local)
# ┌────────▼────┐      ┌────────┐      ┌──────────┐
# │     app     │      │ worker │      │ migrate  │ (roda uma vez e sai)
# └──────┬──────┘      └───┬────┘      └────┬─────┘
#        └────────────┬────┴────────────────┘
#                ┌────▼─────┐
#                │ postgres │  volume nomeado, sem porta no host
#                └──────────┘
#
# **A única porta publicada é a do app, e só em 127.0.0.1.** O rate limiting
# conta tentativas por `CF-Connecting-IP`, header que o Cloudflare escreve e o
# nginx repassa intacto (ver servidor/pedido.ts). Um pedido que chegue por outro
# caminho não tem esse header, e `ipDoPedido()` cai em 127.0.0.1 para todo mundo:
# cinco erros de digitação trancariam o app inclusive para quem sabe a senha.
#
# O `127.0.0.1:` do `ports:` é o que mantém esse caminho alternativo restrito a
# processos deste host — que é onde o nginx mora, e onde quem já tem acesso
# também tem o volume do Postgres. O que ele impede é a rede local inteira ter
# uma porta de entrada sem túnel. **Nunca troque por `"3000:3000"`.**
#
# O Postgres não publica nada: quem fala com ele está na rede `interna`.
#
# Variáveis: copie `.env.producao.example` para `.env` ao lado deste arquivo.

name: controle-habito

# O ambiente comum aos três serviços que falam com o banco.
#
# `DATABASE_URL` é montada aqui e NÃO vem do `.env`: a senha teria de ser escrita
# duas vezes (na variável do Postgres e dentro da URL), e duas cópias de uma
# senha é uma cópia que vai divergir. Por isso `POSTGRES_PASSWORD` tem de usar só
# caracteres seguros em URL — `openssl rand -hex 32` resolve.
x-ambiente-do-app: &ambiente-do-app
  NODE_ENV: production
  # O código não depende disto: `horaDeParede` usa o fuso de `config_app` pelo
  # `Intl`, justamente para não herdar o do processo. O que o TZ muda é o
  # carimbo de hora do `docker logs`.
  TZ: ${TZ:-America/Sao_Paulo}
  DATABASE_URL: postgres://${POSTGRES_USER:-habito}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-controle_habito}

services:
  postgres:
    image: postgres:16-alpine
    container_name: habito_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_habito}
      POSTGRES_USER: ${POSTGRES_USER:-habito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres:/var/lib/postgresql/data
      # O diretório de backup, montado para dentro do contêiner.
      #
      # `pg_dump` e `pg_restore` moram aqui, não no host — o host de um homelab
      # não precisa de um cliente Postgres instalado só para isso, e versão de
      # cliente diferente da do servidor é uma classe de erro inteira que esta
      # montagem elimina. Os dois trabalham com arquivo, e não com stdin: para o
      # formato custom, `pg_restore` lendo de um cano não consegue reordenar nem
      # restaurar seletivamente.
      #
      # Os arquivos ficam do usuário `postgres` do contêiner (uid 999). Apagar um
      # deles no host depende da permissão do DIRETÓRIO, não do arquivo, então a
      # retenção de infra/backup.sh funciona sem root.
      - ${HABITO_BACKUP_DIR:-/var/backups/controle-habito}:/backups
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habito} -d ${POSTGRES_DB:-controle_habito}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Migrations e seeds, uma vez por subida, antes de app e worker existirem.
  #
  # Serviço de passagem e não entrypoint das outras duas imagens: app e worker
  # sobem juntos, e os dois rodando `migrate latest` ao mesmo tempo disputariam a
  # trava do Knex num banco que ainda não tem a tabela de trava — a corrida
  # acontece exatamente na primeira subida, que é a que menos pode falhar. Com
  # `service_completed_successfully` nos dois, ninguém sobe sobre schema velho.
  migrate:
    build:
      context: .
      target: worker
    image: controle-habito-worker:local
    container_name: habito_migrate
    restart: "no"
    env_file: .env
    environment: *ambiente-do-app
    command: ["sh", "infra/migrar.sh"]
    networks: [interna]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    image: controle-habito-app:local
    container_name: habito_app
    restart: unless-stopped
    env_file: .env
    environment: *ambiente-do-app
    # A porta, **presa no loopback**. Ver a nota no topo do arquivo: o `127.0.0.1:`
    # não é enfeite, é a diferença entre "o nginx deste host alcança" e "a rede
    # local alcança". Sem ele o Docker publica em 0.0.0.0 e, pior, o faz pela
    # cadeia DOCKER-USER do iptables — que passa por cima da regra do firewall do
    # host, então um `ufw deny 3000` não protegeria nada.
    #
    # A porta do host é configurável porque num homelab a 3000 é disputada; a de
    # dentro do contêiner é fixa, é o PORT da imagem.
    ports:
      - "127.0.0.1:${HABITO_PORTA_LOCAL:-3000}:3000"
    networks: [interna]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # `/api/auth/estado` é a rota pública que consulta o banco — serve de
      # liveness e de readiness de uma vez, e não precisa de sessão. Qualquer
      # outra responderia 401 e o contêiner pareceria doente.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/auth/estado || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      target: worker
    image: controle-habito-worker:local
    container_name: habito_worker
    restart: unless-stopped
    env_file: .env
    environment: *ambiente-do-app
    # O CMD da imagem: tsx worker/index.ts
    #
    # O SIGTERM não interrompe o tique em curso, ele marca o laço para parar
    # depois dele (worker/index.ts). Matar no meio de uma materialização é o que
    # a transação protege, mas o processo precisa do tempo de terminá-la — os 10 s
    # de carência padrão do Docker não bastam para a virada das 04:00 de um banco
    # com histórico.
    stop_grace_period: 90s
    networks: [interna]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  # Nomeado, e o nome completo é `controle-habito_postgres` (o `name:` do topo
  # vira prefixo). É o que o backup e a restauração em infra/ pressupõem.
  postgres:

# Uma rede, e nada de fora entra nela.
#
# **Não há serviço `cloudflared` nem `nginx` nesta pilha.** O homelab já roda os
# dois: o túnel com o token da conta e todas as rotas num lugar só, e o nginx
# distribuindo por domínio para cada aplicação do servidor. Um segundo de
# qualquer um deles seria uma segunda credencial ou um segundo lugar onde olhar
# quando o domínio não responde.
#
# A ligação com eles é a porta em `127.0.0.1` no serviço `app`, e não uma rede
# compartilhada, porque o nginx **não é um contêiner**: um processo do host não
# resolve `app` pelo DNS do Docker, e `proxy_pass http://app:3000` falha ali com
# "host not found in upstream". Ver Docs/Deploy.md, passo 2.
#
# `name:` explícito de propósito: sem ele o compose prefixaria com o `name:` do
# topo, e o nome mudaria junto com o do projeto.
networks:
  # Onde os quatro serviços se falam. O Postgres só existe aqui.
  interna:
    name: controle-habito-interna
